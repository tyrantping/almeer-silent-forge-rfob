name: Build APK
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Version and signing key
        env:
          KEY: 
        run: |
          echo "VER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "$KEY" | base64 -d > app/alma-release.p12
      - name: Build
        run: gradle -PverCode=$VER -PghRepo=$GITHUB_REPOSITORY assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VER }}
          name: Alma Connect 0.6.${{ env.VER }}
          make_latest: true
          files: app/build/outputs/apk/*/*.apk
