name: Build APK
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Version
        run: echo "VER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
            gradle -PverCode=$VER assembleRelease
          else
            gradle -PverCode=$VER assembleDebug
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VER }}
          name: Alma Connect 0.5.${{ env.VER }}
          make_latest: true
          files: app/build/outputs/apk/*/*.apk
